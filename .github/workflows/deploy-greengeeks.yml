name: Deploy to GreenGeeks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greengeeks-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate website
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/script.js
          test -f dist/Jozef_Balint_CV.pdf

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GG_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GG_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/greengeeks
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/greengeeks ~/.ssh/known_hosts

      - name: Deploy dist
        env:
          GG_HOST: ${{ secrets.GG_HOST }}
          GG_USER: ${{ secrets.GG_USER }}
          GG_PORT: ${{ secrets.GG_PORT }}
          GG_TARGET_PATH: ${{ secrets.GG_TARGET_PATH }}
        run: |
          test -n "$GG_HOST"
          test -n "$GG_USER"
          test -n "$GG_TARGET_PATH"

          rsync \
            --archive \
            --compress \
            --delete-delay \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/greengeeks -p ${GG_PORT:-22}" \
            dist/ \
            "${GG_USER}@${GG_HOST}:${GG_TARGET_PATH}/"
